<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fahrspur — Dashcam & Navi</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --panel-bg: rgba(20, 20, 20, 0.88);
            --panel-border: rgba(255, 255, 255, 0.12);
            --text-color: #ffffff;
            --text-dim: #aaaaaa;
            --accent-red: #e50914;
            --accent-blue: #2196F3;
            --accent-green: #2e7d32;
            --accent-orange: #ef6c00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-color); font-family: 'Ubuntu', sans-serif; color: var(--text-color); }
        #app-container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
        #video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #000; }
        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        #map-container { position: absolute; bottom: 25px; right: 25px; width: 340px; height: 260px; z-index: 10; border-radius: 16px; overflow: hidden; box-shadow: 0 12px 36px rgba(0,0,0,0.6); border: 2px solid var(--panel-border); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #map { width: 100%; height: 100%; background: #111; }
        #app-container.swap-views #video-container { position: absolute; bottom: 25px; right: 25px; width: 340px; height: 260px; z-index: 10; border-radius: 16px; overflow: hidden; box-shadow: 0 12px 36px rgba(0,0,0,0.6); border: 2px solid var(--panel-border); }
        #app-container.swap-views #map-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; border-radius: 0; border: none; box-shadow: none; }
        #titelleiste-top { position: absolute; top: 15px; left: 15px; right: 15px; z-index: 25; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
        .leisten-panel { background: var(--panel-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 8px 18px; border-radius: 40px; display: flex; align-items: center; gap: 14px; pointer-events: auto; box-shadow: 0 6px 20px rgba(0,0,0,0.45); border: 1px solid var(--panel-border); }
        .rec-indicator { width: 12px; height: 12px; background: #555; border-radius: 50%; transition: background 0.3s; }
        .rec-active .rec-indicator { background: var(--accent-red); animation: pulse-red 1s infinite alternate; }
        @keyframes pulse-red { 0% { transform: scale(0.9); opacity: 0.6; } 100% { transform: scale(1.1); opacity: 1; } }
        #timer-display { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; color: #fff; }
        .icon-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 50%; }
        .badge { background: var(--accent-blue); color: #fff; padding: 2px 7px; border-radius: 12px; font-size: 11px; font-weight: 700; margin-left: 4px; }
        .rec-button-outer { width: 32px; height: 32px; border-radius: 50%; background: transparent; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .rec-button-inner { width: 20px; height: 20px; border-radius: 50%; background: var(--accent-red); }
        .rec-active .rec-button-inner { background: #fff; border-radius: 4px; width: 14px; height: 14px; }
        .rec-active .rec-button-outer { border-color: var(--accent-red); }
        .tacho-box { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; border-left: 1px solid rgba(255,255,255,0.15); padding-left: 12px; }
        #speed-limit-sign { width: 40px; height: 40px; border: 4px solid #d32f2f; border-radius: 50%; background: #ffffff; color: #000000; font-weight: 700; font-size: 16px; display: none; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(0,0,0,0.35); }
        #turn-instruction-banner { position: absolute; top: 75px; left: 50%; transform: translateX(-50%); z-index: 20; background: var(--panel-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 12px 24px; border-radius: 14px; width: 90%; max-width: 420px; text-align: center; box-shadow: 0 6px 22px rgba(0,0,0,0.4); display: none; font-size: 15px; font-weight: 700; border-left: 5px solid var(--accent-blue); }
        #bedienung-bottom { position: absolute; bottom: 25px; left: 25px; width: 350px; z-index: 20; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
        .bottom-panel { background: var(--panel-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 16px; border-radius: 18px; pointer-events: auto; box-shadow: 0 8px 28px rgba(0,0,0,0.5); border: 1px solid var(--panel-border); }
        .search-group { position: relative; margin-bottom: 12px; }
        input[type="text"] { width: 100%; padding: 12px 16px; background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; color: #fff; font-size: 14px; outline: none; font-family: inherit; }
        .suggestions-box { position: absolute; bottom: 100%; left: 0; right: 0; background: #181818; border-radius: 10px; margin-bottom: 6px; max-height: 200px; overflow-y: auto; z-index: 100; box-shadow: 0 -6px 20px rgba(0,0,0,0.55); display: none; border: 1px solid #2c2c2c; }
        .suggestion-item { padding: 11px 16px; font-size: 13.5px; border-bottom: 1px solid #222; cursor: pointer; color: #e0e0e0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .suggestion-item:hover { background: #2a2a2a; color: #fff; }
        button { padding: 12px; background: var(--accent-blue); color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; font-size: 14.5px; font-family: inherit; }
        #route-summary-box { display: none; }
        .summary-text { font-size: 14px; margin-bottom: 12px; color: #dddddd; line-height: 1.45; }
        .summary-buttons { display: flex; gap: 10px; }
        .btn-secondary { background: #3a3a3a; }
        #start-nav-btn { background: var(--accent-green); }
        .fullscreen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); z-index: 110; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .modal-content { background: #161616; width: 100%; max-width: 440px; border-radius: 20px; padding: 26px; border: 1px solid #2d2d2d; max-height: 85vh; overflow-y: auto; }
        .modal-content h2 { margin-bottom: 20px; font-size: 21px; font-weight: 700; border-bottom: 1px solid #262626; padding-bottom: 10px; }
        .setting-row { margin-bottom: 16px; }
        .setting-row label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-dim); font-weight: 700; }
        select { width: 100%; padding: 11px; background: #222; border: 1px solid #333; border-radius: 8px; color: #fff; outline: none; font-family: inherit; }
        .checkbox-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
        .checkbox-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent-blue); }
        .clip-list-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .clip-item { background: #222; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2a2a2a; }
        .clip-info { display: flex; flex-direction: column; gap: 3px; }
        .clip-name { font-size: 13.5px; font-weight: 700; }
        .clip-meta { font-size: 11.5px; color: var(--text-dim); }
        .clip-actions { display: flex; gap: 8px; }
        .clip-btn { padding: 6px 10px; font-size: 12px; border-radius: 6px; width: auto; }
        #traffic-legend { position: absolute; bottom: 12px; left: 12px; background: rgba(10, 10, 10, 0.88); padding: 6px 12px; border-radius: 8px; font-size: 11px; z-index: 1000; display: none; flex-direction: column; gap: 5px; pointer-events: none; border: 1px solid rgba(255,255,255,0.08); }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .legend-color { width: 14px; height: 14px; border-radius: 3px; }
        .leaflet-control-zoom { margin-bottom: 300px !important; margin-right: 12px !important; }
    </style>
</head>
<body>
<div id="app-container">
    <div id="video-container">
        <video id="webcam-raw" autoplay playsinline muted></video>
        <canvas id="dashcam-canvas"></canvas>
    </div>
    <div id="map-container">
        <div id="map"></div>
        <div id="traffic-legend">
            <div class="legend-item"><div class="legend-color" style="background:var(--accent-green)"></div>Frei</div>
            <div class="legend-item"><div class="legend-color" style="background:var(--accent-orange)"></div>Zähflüssig</div>
            <div class="legend-item"><div class="legend-color" style="background:var(--accent-red)"></div>Stau</div>
        </div>
    </div>
    <div id="titelleiste-top">
        <div class="leisten-panel leiste-links" id="rec-status-group">
            <div class="rec-indicator"></div>
            <span id="timer-display">00:00</span>
            <button class="icon-btn" onclick="openClipsModal()">🎞️<span class="badge" id="clips-badge">0</span></button>
        </div>
        <div id="turn-instruction-banner">Route initialisiert</div>
        <div class="leisten-panel leiste-rechts">
            <button class="icon-btn" title="Ansichten tauschen" onclick="swapViewports()">⇄</button>
            <button class="icon-btn" id="toggle-inset-btn" title="Minimieren" onclick="toggleMapInset()">👁️</button>
            <button class="icon-btn" title="Einstellungen" onclick="openSettingsModal()">⚙️</button>
            <div class="tacho-box">
                <span id="speed-display">-- km/h</span>
                <div id="speed-limit-sign">--</div>
            </div>
            <div onclick="toggleRecordingEngine()" style="display: flex; align-items: center; margin-left: 4px;">
                <div class="rec-button-outer"><div class="rec-button-inner"></div></div>
            </div>
        </div>
    </div>
    <div id="bedienung-bottom">
        <div class="bottom-panel" id="search-panel">
            <div class="search-group">
                <input type="text" id="target-search" placeholder="Zieladresse oder Koordinaten..." oninput="handleSearchAutocomplete(this.value)" autocomplete="off">
                <div id="suggestions" class="suggestions-box"></div>
            </div>
            <button id="calc-route-btn" onclick="executeRouteCalculation()">Los</button>
        </div>
        <div class="bottom-panel" id="route-summary-box">
            <div class="summary-text" id="summary-info-text">Route wird berechnet...</div>
            <div class="summary-buttons">
                <button class="btn-secondary" onclick="resetNavigationState()">Bearbeiten</button>
                <button id="start-nav-btn" onclick="triggerNavigationGuidance()">▶ Navigation starten</button>
            </div>
        </div>
    </div>
    <div id="settings-modal" class="fullscreen-overlay">
        <div class="modal-content">
            <h2>Einstellungen</h2>
            <div class="setting-row">
                <label for="tomtom-key-input">TomTom Developer API-Key</label>
                <input type="text" id="tomtom-key-input" placeholder="Hinterlege tomtom key...">
            </div>
            <div class="setting-row">
                <label for="camera-select">Kameraauswahl</label>
                <select id="camera-select" onchange="restartCameraStream()"></select>
            </div>
            <div class="setting-row">
                <label for="resolution-select">Videoauflösung</label>
                <select id="resolution-select" onchange="restartCameraStream()">
                    <option value="max">Maximal verfügbar</option>
                    <option value="1080">Full HD (1920×1080)</option>
                    <option value="720" selected>HD (1280×720)</option>
                </select>
            </div>
            <div class="setting-row">
                <label for="loop-select">Loop-Aufnahme Intervall</label>
                <select id="loop-select">
                    <option value="0">Aus — durchgehend aufnehmen</option>
                    <option value="5" selected>Letzte 5 Minuten</option>
                    <option value="10">Letzte 10 Minuten</option>
                    <option value="15">Letzte 15 Minuten</option>
                    <option value="30">Letzte 30 Minuten</option>
                </select>
            </div>
            <div class="setting-row checkbox-row">
                <input type="checkbox" id="mic-enabled-check" checked>
                <label for="mic-enabled-check" style="display:inline; margin:0;">Mikrofon bei Aufnahme aktivieren</label>
            </div>
            <div class="setting-row" style="margin-top: 25px; display: flex; gap: 10px;">
                <button onclick="commitSettings()" style="background:var(--accent-green);">Übernehmen</button>
                <button onclick="hideOverlayModal('settings-modal')" class="btn-secondary">Abbrechen</button>
            </div>
        </div>
    </div>
    <div id="clips-modal" class="fullscreen-overlay">
        <div class="modal-content">
            <h2>Aufnahmen dieser Sitzung</h2>
            <div class="clip-list-container" id="clips-list"></div>
            <button onclick="hideOverlayModal('clips-modal')" class="btn-secondary">Schliessen</button>
        </div>
    </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const APP_VERSION = "2.0.0";
    let mapObject, userMarkerObject;
    let geoCurrentLat = 47.3769, geoCurrentLon = 8.5417;
    let currentMovingSpeedKmh = 0;
    let liveTrafficPolylines = [];
    let activeNavigationMode = false;
    let mapInsetStateVisible = true;
    let searchDebounceTimer = null;
    let ttsVoiceEngine = window.speechSynthesis;
    let localStreamInstance = null, activeMediaRecorder = null, recordedChunksCollection = [];
    let loopWatchdogTimer = null, sessionClipsDatabase = [];
    let canvasRenderContext = null, canvasAnimationId = null;
    let recordingStopwatchInterval = null, recordingElapsedTimeSeconds = 0, isRecording = false;
    window.aktuelleRoutenPunkte = null; window.aktuelleRoutenSegmente = []; let lastSpokenInstructionIndex = -1;

    window.addEventListener('DOMContentLoaded', () => {
        setupLeafletMap(); setupGeolocationWatch();
        populateAvailableCameraDevices().then(() => { initiateCameraPipeline(); });
        restoreStoredPreferences(); initializeCanvasContext();
    });

    function setupLeafletMap() {
        mapObject = L.map('map', { zoomControl: true, attributionControl: false }).setView([geoCurrentLat, geoCurrentLon], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapObject);
        userMarkerObject = L.circleMarker([geoCurrentLat, geoCurrentLon], { radius: 9, fillColor: '#2196F3', color: '#ffffff', weight: 2.5, fillOpacity: 1 }).addTo(mapObject);
        mapObject.zoomControl.setPosition('bottomright');
        mapObject.on('movestart', () => {
            if (activeNavigationMode) {
                document.getElementById('start-nav-btn').innerText = "▶ Zentrieren";
                document.getElementById('start-nav-btn').style.background = "var(--accent-blue)";
            }
        });
    }

    function setupGeolocationWatch() {
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((pos) => {
                geoCurrentLat = pos.coords.latitude; geoCurrentLon = pos.coords.longitude;
                if (pos.coords.speed !== null && pos.coords.speed !== undefined) {
                    currentMovingSpeedKmh = Math.round(pos.coords.speed * 3.6);
                    document.getElementById('speed-display').innerText = `${currentMovingSpeedKmh} km/h`;
                } else {
                    currentMovingSpeedKmh = 0; document.getElementById('speed-display').innerText = `0 km/h`;
                }
                userMarkerObject.setLatLng([geoCurrentLat, geoCurrentLon]);
                processRealtimeSpeedLimitsMatching(geoCurrentLat, geoCurrentLon);
                if (activeNavigationMode && document.getElementById('start-nav-btn').innerText === "🎯 Zentrieren") {
                    mapObject.setView([geoCurrentLat, geoCurrentLon], 17);
                }
            }, (err) => { console.error(err); }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
        }
    }

    async function populateAvailableCameraDevices() {
        const selectElement = document.getElementById('camera-select'); selectElement.innerHTML = '';
        try {
            await navigator.mediaDevices.getUserMedia({ video: true });
            const elements = await navigator.mediaDevices.enumerateDevices();
            let count = 1;
            elements.forEach(dev => {
                if (dev.kind === 'videoinput') {
                    const opt = document.createElement('option'); opt.value = dev.deviceId;
                    opt.text = dev.label || `Kamera ${count++}`; selectElement.appendChild(opt);
                }
            });
        } catch (e) {
            const opt = document.createElement('option'); opt.text = "Standard Kamera"; selectElement.appendChild(opt);
        }
    }

    async function initiateCameraPipeline() {
        if (localStreamInstance) { localStreamInstance.getTracks().forEach(t => t.stop()); }
        const selectedId = document.getElementById('camera-select').value;
        const resProfile = document.getElementById('resolution-select').value;
        let videoConstraints = { facingMode: "environment" };
        if (selectedId) { videoConstraints = { deviceId: { exact: selectedId } }; }
        if (resProfile === "1080") { videoConstraints.width = { ideal: 1920 }; videoConstraints.height = { ideal: 1080 }; }
        else if (resProfile === "720") { videoConstraints.width = { ideal: 1280 }; videoConstraints.height = { ideal: 720 }; }
        try {
            localStreamInstance = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: document.getElementById('mic-enabled-check').checked });
            document.getElementById('webcam-raw').srcObject = localStreamInstance;
        } catch (err) { console.error(err); }
    }

    function restartCameraStream() { initiateCameraPipeline(); }

    function initializeCanvasContext() {
        const canvas = document.getElementById('dashcam-canvas'); canvasRenderContext = canvas.getContext('2d');
        const rawVideo = document.getElementById('webcam-raw');
        function renderOverlayLoop() {
            if (rawVideo.readyState === rawVideo.HAVE_ENOUGH_DATA) {
                if (canvas.width !== rawVideo.videoWidth || canvas.height !== rawVideo.videoHeight) {
                    canvas.width = rawVideo.videoWidth; canvas.height = rawVideo.videoHeight;
                }
                canvasRenderContext.drawImage(rawVideo, 0, 0, canvas.width, canvas.height);
                canvasRenderContext.fillStyle = "rgba(0, 0, 0, 0.5)"; canvasRenderContext.fillRect(15, canvas.height - 85, 420, 70);
                canvasRenderContext.fillStyle = "#ffffff"; canvasRenderContext.font = "bold 16px 'Ubuntu', sans-serif";
                const d = new Date(); canvasRenderContext.fillText(d.toLocaleDateString() + " " + d.toLocaleTimeString(), 25, canvas.height - 60);
                canvasRenderContext.fillText(`GPS: ${geoCurrentLat.toFixed(5)}, ${geoCurrentLon.toFixed(5)} | ${currentMovingSpeedKmh} km/h`, 25, canvas.height - 30);
            }
            canvasAnimationId = requestAnimationFrame(renderOverlayLoop);
        }
        canvasAnimationId = requestAnimationFrame(renderOverlayLoop);
    }

    function toggleRecordingEngine() {
        const statusPanel = document.getElementById('rec-status-group');
        if (!isRecording) { startRecordingPipeline(); statusPanel.classList.add('rec-active'); isRecording = true; }
        else { stopRecordingPipeline(); statusPanel.classList.remove('rec-active'); isRecording = false; }
    }

    function startRecordingPipeline() {
        recordedChunksCollection = []; const canvasStream = document.getElementById('dashcam-canvas').captureStream(25);
        if (document.getElementById('mic-enabled-check').checked && localStreamInstance && localStreamInstance.getAudioTracks().length > 0) {
            canvasStream.addTrack(localStreamInstance.getAudioTracks()[0]);
        }
        let options = { mimeType: 'video/webm;codecs=vp8' };
        if (MediaRecorder.isTypeSupported('video/mp4;codecs=h264')) { options = { mimeType: 'video/mp4;codecs=h264' }; }
        try { activeMediaRecorder = new MediaRecorder(canvasStream, options); } catch (e) { activeMediaRecorder = new MediaRecorder(canvasStream); }
        activeMediaRecorder.ondataavailable = (event) => { if (event.data && event.data.size > 0) recordedChunksCollection.push(event.data); };
        activeMediaRecorder.onstop = () => { packageCompletedClip(); };
        activeMediaRecorder.start(); executeStopwatchCounter(true);
        const loopIntervalMinutes = parseInt(document.getElementById('loop-select').value);
        if (loopIntervalMinutes > 0) { loopWatchdogTimer = setInterval(() => { rotateLoopSegment(); }, loopIntervalMinutes * 60 * 1000); }
    }

    function stopRecordingPipeline() {
        if (activeMediaRecorder && activeMediaRecorder.state !== "inactive") { activeMediaRecorder.stop(); }
        executeStopwatchCounter(false); if (loopWatchdogTimer) { clearInterval(loopWatchdogTimer); loopWatchdogTimer = null; }
    }

    function rotateLoopSegment() { if (activeMediaRecorder && activeMediaRecorder.state === "recording") { activeMediaRecorder.stop(); activeMediaRecorder.start(); } }

    function packageCompletedClip() {
        if (recordedChunksCollection.length === 0) return;
        const blob = new Blob(recordedChunksCollection, { type: activeMediaRecorder.mimeType || 'video/mp4' });
        recordedChunksCollection = [];
        const timestampStr = new Date().toISOString().replace(/T/, '_').replace(/\..+/, '').replace(/:/g, '-');
        const filename = `Fahrspur_Clip_${timestampStr}.${blob.type.includes('webm') ? 'webm' : 'mp4'}`;
        sessionClipsDatabase.push({ name: filename, blob: blob, size: (blob.size / (1024 * 1024)).toFixed(1) + " MB" });
        const loopIntervalMinutes = parseInt(document.getElementById('loop-select').value);
        if (loopIntervalMinutes > 0 && sessionClipsDatabase.length > 4) { sessionClipsDatabase.shift(); }
        document.getElementById('clips-badge').innerText = sessionClipsDatabase.length;
    }

    function executeStopwatchCounter(run) {
        if (run) {
            recordingElapsedTimeSeconds = 0; document.getElementById('timer-display').innerText = "00:00";
            recordingStopwatchInterval = setInterval(() => {
                recordingElapsedTimeSeconds++;
                const mins = String(Math.floor(recordingElapsedTimeSeconds / 60)).padStart(2, '0');
                const secs = String(recordingElapsedTimeSeconds % 60).padStart(2, '0');
                document.getElementById('timer-display').innerText = `${mins}:${secs}`;
            }, 1000);
        } else { clearInterval(recordingStopwatchInterval); document.getElementById('timer-display').innerText = "00:00"; }
    }

    async function executeRouteCalculation() {
        const queryVal = document.getElementById('target-search').value.trim(); if (!queryVal) return;
        const apiKey = localStorage.getItem('tomtom_api_key');
        if (!apiKey) { alert("Bitte hinterlege deinen TomTom Key über Einstellungen (⚙️)."); openSettingsModal(); return; }
        liveTrafficPolylines.forEach(p => mapObject.removeLayer(p)); liveTrafficPolylines = [];
        const coordPattern = /^[-+]?([1-8]?\d(\.\d+)?|90(\.0+)?),\s*[-+]?(180(\.0+)?|((1[0-7]\d)|([1-9]?\d))(\.\d+)?)$/;
        if (coordPattern.test(queryVal)) {
            const parts = queryVal.split(','); fetchTomTomEngine(geoCurrentLat, geoCurrentLon, parseFloat(parts[0].trim()), parseFloat(parts[1].trim()), apiKey); return;
        }
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryVal)}&limit=1`);
            const arrayRes = await res.json();
            if (arrayRes.length > 0) { fetchTomTomEngine(geoCurrentLat, geoCurrentLon, parseFloat(arrayRes[0].lat), parseFloat(arrayRes[0].lon), apiKey); }
            else { alert("Ort wurde nicht gefunden."); }
        } catch (e) { alert("Fehler beim Geocoding."); }
    }

    async function fetchTomTomEngine(sLat, sLon, dLat, dLon, key) {
        document.getElementById('summary-info-text').innerText = "Route wird berechnet...";
        const pointsString = `${sLat},${sLon}:${dLat},${dLon}`;
        const url = `https://api.tomtom.com/routing/1/calculateRoute/${pointsString}/json?key=${key}&traffic=true&sectionType=speedLimit&travelMode=car&instructionsType=coded`;
        try {
            const response = await fetch(url); const data = await response.json();
            if (!data.routes || data.routes.length === 0) { alert("Keine Route gefunden."); return; }
            const tr = data.routes[0]; const secondsTotal = tr.summary.travelTimeInSeconds;
            const etaDateInstance = new Date(Date.now() + secondsTotal * 1000); const remainingMinutes = Math.round(secondsTotal / 60);
            document.getElementById('search-panel').style.display = 'none'; document.getElementById('route-summary-box').style.display = 'block';
            document.getElementById('summary-info-text').innerHTML = `<b>Ankunft: ${etaDateInstance.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</b> · noch ${remainingMinutes} Min.`;
            const flatPointsArray = tr.legs[0].points.map(pt => [pt.latitude, pt.longitude]); window.aktuelleRoutenPunkte = flatPointsArray;
            window.aktuelleRoutenSegmente = [];
            if (tr.sections) {
                tr.sections.forEach(s => {
                    if (s.sectionType === "speedLimit") { window.aktuelleRoutenSegmente.push({ start: s.startPointIndex, end: s.endPointIndex, limitValue: s.speedLimit }); }
                });
            }
            window.routenAnweisungen = tr.guidance ? tr.guidance.instructions : []; lastSpokenInstructionIndex = -1;
            document.getElementById('traffic-legend').style.display = 'flex'; const congestionSegments = tr.sections.filter(s => s.sectionType === "traffic");
            for (let i = 0; i < flatPointsArray.length - 1; i++) {
                const nodeA = flatPointsArray[i]; const nodeB = flatPointsArray[i+1];
                let flowColor = 'var(--accent-green)'; let trackWeight = 6;
                const matchingCongestion = congestionSegments.find(c => i >= c.startPointIndex && i <= c.endPointIndex);
                if (matchingCongestion) {
                    const delaySeverity = matchingCongestion.magnitudeOfDelay;
                    if (delaySeverity === 3 || delaySeverity === 4) { flowColor = 'var(--accent-red)'; trackWeight = 8; }
                    else if (delaySeverity === 1 || delaySeverity === 2) { flowColor = 'var(--accent-orange)'; trackWeight = 7; }
                }
                const segmentLine = L.polyline([nodeA, nodeB], { color: flowColor, weight: trackWeight, opacity: 0.88, lineCap: 'round' }).addTo(mapObject);
                liveTrafficPolylines.push(segmentLine);
            }
            activeNavigationMode = false; document.getElementById('start-nav-btn').innerText = "▶ Navigation starten";
            document.getElementById('start-nav-btn').style.background = "var(--accent-green)";
            const boundaryLine = L.polyline(flatPointsArray); mapObject.fitBounds(boundaryLine.getBounds(), { padding: [40, 40] });
        } catch (err) { console.error(err); alert("Fehler beim Laden der TomTom Daten."); }
    }

    function processRealtimeSpeedLimitsMatching(uLat, uLon) {
        if (!window.aktuelleRoutenPunkte || window.aktuelleRoutenSegmente.length === 0) return;
        let minimalDistance = Infinity; let coreMatchIndex = 0;
        window.aktuelleRoutenPunkte.forEach((pt, index) => {
            const dy = pt[0] - uLat; const dx = pt[1] - uLon; const dist = dy*dy + dx*dx;
            if (dist < minimalDistance) { minimalDistance = dist; coreMatchIndex = index; }
        });
        const segmentResult = window.aktuelleRoutenSegmente.find(s => coreMatchIndex >= s.start && coreMatchIndex <= s.end);
        const trafficSignElement = document.getElementById('speed-limit-sign');
        if (segmentResult && segmentResult.limitValue) { trafficSignElement.innerText = segmentResult.limitValue; trafficSignElement.style.display = 'flex'; }
        else { trafficSignElement.style.display = 'none'; }
        if (window.routenAnweisungen && window.routenAnweisungen.length > 0) {
            const instructionMatch = window.routenAnweisungen.find(ins => coreMatchIndex >= ins.pointIndex - 3 && coreMatchIndex <= ins.pointIndex + 2);
            if (instructionMatch) {
                const matchedIdx = window.routenAnweisungen.indexOf(instructionMatch);
                if (matchedIdx !== lastSpokenInstructionIndex) {
                    lastSpokenInstructionIndex = matchedIdx; const msgText = instructionMatch.message;
                    document.getElementById('turn-instruction-banner').innerText = msgText; document.getElementById('turn-instruction-banner').style.display = 'block';
                    if (ttsVoiceEngine && !ttsVoiceEngine.speaking) {
                        const speechUtterance = new SpeechSynthesisUtterance(msgText); speechUtterance.lang = 'de-DE'; ttsVoiceEngine.speak(speechUtterance);
                    }
                }
            }
        }
    }

    function triggerNavigationGuidance() {
        const btn = document.getElementById('start-nav-btn');
        if (!activeNavigationMode || btn.innerText === "▶ Zentrieren") {
            activeNavigationMode = true; btn.innerText = "🎯 Zentrieren"; btn.style.background = "var(--panel-bg)";
            mapObject.setView([geoCurrentLat, geoCurrentLon], 17);
        } else { mapObject.setView([geoCurrentLat, geoCurrentLon], 17); }
    }

    function resetNavigationState() {
        activeNavigationMode = false; document.getElementById('route-summary-box').style.display = 'none';
        document.getElementById('turn-instruction-banner').style.display = 'none'; document.getElementById('search-panel').style.display = 'block';
        liveTrafficPolylines.forEach(p => mapObject.removeLayer(p)); document.getElementById('traffic-legend').style.display = 'none';
        document.getElementById('speed-limit-sign').style.display = 'none'; window.aktuelleRoutenPunkte = null; window.routenAnweisungen = [];
    }

    function handleSearchAutocomplete(inputVal) {
        if (searchDebounceTimer) clearTimeout(searchDebounceTimer); const wrapper = document.getElementById('suggestions');
        if (!inputVal || inputVal.trim().length < 3) { wrapper.style.display = 'none'; return; }
        searchDebounceTimer = setTimeout(async () => {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(inputVal)}&limit=5`);
                const matches = await res.json();
                if (matches && matches.length > 0) {
                    wrapper.innerHTML = '';
                    matches.forEach(m => {
                        const item = document.createElement('div'); item.className = 'suggestion-item'; item.innerText = m.display_name;
                        item.onclick = () => { document.getElementById('target-search').value = m.display_name; wrapper.style.display = 'none'; };
                        wrapper.appendChild(item);
                    });
                    wrapper.style.display = 'block';
                } else { wrapper.style.display = 'none'; }
            } catch(e) { console.error(e); }
        }, 400);
    }

    function swapViewports() { document.getElementById('app-container').classList.toggle('swap-views'); setTimeout(() => mapObject.invalidateSize(), 320); }
    function toggleMapInset() { const frame = document.getElementById('map-container'); mapInsetStateVisible = !mapInsetStateVisible; frame.style.display = mapInsetStateVisible ? 'block' : 'none'; document.getElementById('toggle-inset-btn').innerText = mapInsetStateVisible ? '👁️' : '🕶️'; }
    function openSettingsModal() { document.getElementById('settings-modal').style.display = 'flex'; }
    function hideOverlayModal(id) { document.getElementById(id).style.display = 'none'; }
    
    function commitSettings() {
        const key = document.getElementById('tomtom-key-input').value.trim(); localStorage.setItem('tomtom_api_key', key);
        localStorage.setItem('mic_enabled_pref', document.getElementById('mic-enabled-check').checked);
        localStorage.setItem('loop_duration_pref', document.getElementById('loop-select').value);
        localStorage.setItem('resolution_pref', document.getElementById('resolution-select').value);
        localStorage.setItem('camera_device_pref', document.getElementById('camera-select').value);
        hideOverlayModal('settings-modal'); restartCameraStream();
    }

    function restoreStoredPreferences() {
        const key = localStorage.getItem('tomtom_api_key'); if (key) document.getElementById('tomtom-key-input').value = key;
        const mic = localStorage.getItem('mic_enabled_pref'); if (mic !== null) document.getElementById('mic-enabled-check').checked = (mic === 'true');
        const loop = localStorage.getItem('loop_duration_pref'); if (loop !== null) document.getElementById('loop-select').value = loop;
        const res = localStorage.getItem('resolution_pref'); if (res !== null) document.getElementById('resolution-select').value = res;
    }

    function openClipsModal() {
        const listWrapper = document.getElementById('clips-list'); listWrapper.innerHTML = '';
        if (sessionClipsDatabase.length === 0) { listWrapper.innerHTML = '<p style="color:var(--text-dim);font-size:13px;text-align:center;padding:10px;">Keine Aufnahmen vorhanden.</p>'; }
        else {
            sessionClipsDatabase.forEach((clip, index) => {
                const item = document.createElement('div'); item.className = 'clip-item';
                item.innerHTML = `<div class="clip-info"><span class="clip-name">${clip.name}</span><span class="clip-meta">Grösse: ${clip.size}</span></div><div class="clip-actions"><button class="clip-btn" style="background:var(--accent-blue);" onclick="downloadClipItem(${index})">💾</button></div>`;
                listWrapper.appendChild(item);
            });
        }
        document.getElementById('clips-modal').style.display = 'flex';
    }

    function downloadClipItem(idx) {
        const targetClip = sessionClipsDatabase[idx]; if (!targetClip) return;
        const dlUrl = URL.createObjectURL(targetClip.blob); const anchor = document.createElement('a');
        anchor.href = dlUrl; anchor.download = targetClip.name; document.body.appendChild(anchor); anchor.click(); document.body.removeChild(anchor); URL.revokeObjectURL(dlUrl);
    }
</script>
